[model]
name = "Qwen/Qwen3-4B"
port = 8011
gpu_id = 0
max_loras = 8
max_lora_rank = 8
gpu_memory_utilization = 0.35
max_model_len = 8192
seed = 42

[genome]
script = "run_genome.py"
model_path = "Qwen/Qwen3-4B"
init_mode = "zero"
tasks = ["mmlu"]
test_tasks = ["mmlu"]
task_weights = [1.0]
combine_method = "ties"
cross_method = "ties"
ports = [8011]
population_size = 4
iters = 1
early_stop = true
early_stop_iter = 1
seed = 42
plot_enabled = true

[setup]
script = "scripts/setup.sh"

[env]
wait_seconds_after_deploy = 90
huggingface_token = "${HF_TOKEN}"

